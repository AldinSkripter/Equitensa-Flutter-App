name: equitensa
description: "Equitensa — native Pay and Finance for iOS and Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  cupertino_ui: ^1.1.6
  file_picker: ^13.3.3
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.4.0
  go_router: ^18.1.4
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.11.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_800ExtraBold.ttf
          weight: 800
